# Local development stack (ADR-025, ADR-028, ADR-034). Nothing here is a deployment target: no cloud vendor is chosen yet.
#
#   make local-secrets   generate ./secrets (git-ignored) once
#   make dev             start the infrastructure: PostgreSQL, Redis, collector, Jaeger, Prometheus
#   make stack           the infrastructure plus the migrations and the API in containers
#   make test-db         start the throw-away test PostgreSQL (port 55432) and Redis (port 56379), loopback only, RAM-backed
#
# Profiles: services without a profile are the infrastructure (`dev`); `app` adds the containers built from this
# repository (migrations, API, worker); `tools` is the on-demand operator tool; `test` is the throw-away integration-test services. Every published port is bound to 127.0.0.1.
#
#   Jaeger UI    http://127.0.0.1:16686
#   Prometheus   http://127.0.0.1:9090
#   Grafana      http://127.0.0.1:3000          (user admin, password in secrets/grafana_admin_password)
#   API          http://127.0.0.1:8080          (profile app)
name: fip-local

x-redis-image: &redis-image redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
x-postgres-image: &postgres-image postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24

# Hardening shared by the containers built from this repository: unprivileged user, read-only root filesystem, no
# capabilities, no privilege escalation. FIP_UID and FIP_GID let a Linux host run the containers as its own user, so
# they can read the 0600 files in ./secrets; the default is the image's unprivileged user.
x-app-hardening: &app-hardening
  user: "${FIP_UID:-65532}:${FIP_GID:-65532}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

x-app-environment: &app-environment
  APP_ENV: local # the local secret store is allowed only here (SR-19)
  APP_VERSION: local
  LOG_FORMAT: json
  POSTGRES_HOST: postgres
  POSTGRES_DB: fip
  POSTGRES_SSLMODE: disable # inside the Compose network only
  SECRETS_DIR: /run/secrets

services:
  postgres:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_DB: fip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      # Every connection needs a password, including loopback inside the container (the image's default pg_hba trusts
      # localhost). Applies when the data volume is first created; recreate the volume to change an existing one.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets:
      - postgres_superuser_password
      - postgres_migrator_password
      - postgres_password
      - postgres_admin_password
      - postgres_readonly_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./postgres/20-role-passwords.sql:/docker-entrypoint-initdb.d/20-role-passwords.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d fip"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Redis holds ephemeral state only (ADR-004): nothing is persisted, and the password comes from a secret file.
  redis:
    image: *redis-image
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --save "" --appendonly no
    secrets:
      - redis_password
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Receives OTLP from the API, applies tail sampling and forwards traces to Jaeger and metrics to Prometheus (ADR-033).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    restart: unless-stopped
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318" # OTLP/HTTP, for an API run on the host (make run)
    depends_on:
      - jaeger

  # Trace viewer. In-memory storage: traces are lost when it stops, which is what a local viewer needs.
  jaeger:
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"

  # Metric viewer. Scrapes the collector's Prometheus exporter; keeps seven days.
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector

  # Dashboards. Stateless: the data source and the dashboards are provisioned from files and the admin password comes from a
  # secret, so nothing lives in the container (the state directory is a tmpfs). Not reachable except from this machine.
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
      - /var/lib/grafana:uid=472,gid=0,mode=0775
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Nothing leaves this machine: no usage reports, no update checks, no plugins downloaded at start.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      - prometheus

  # One-off job: applies the migrations as the schema-owning role, then exits. Never runs inside the API (ADR-031).
  migrate:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: tools
    image: fip-tools:local
    <<: *app-hardening
    command: ["/usr/local/bin/migrate", "up"]
    environment:
      <<: *app-environment
    secrets:
      - postgres_migrator_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Operator tool for clients and keys, run on demand: `make keyctl ARGS="key list"`. It connects as the operator role
  # and is never part of the API image (ADR-034).
  keyctl:
    profiles: ["tools"]
    image: fip-tools:local
    <<: *app-hardening
    entrypoint: ["/usr/local/bin/keyctl"]
    environment:
      <<: *app-environment
      POSTGRES_ADMIN_USER: fip_admin
    secrets:
      - postgres_admin_password
      - api_key_pepper
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    image: fip-api:local
    <<: *app-hardening
    restart: unless-stopped
    environment:
      <<: *app-environment
      HTTP_ADDR: ":8080"
      REDIS_ADDR: redis:6379
      REDIS_TLS: "false" # inside the Compose network only
      TELEMETRY_OTLP_ENDPOINT: http://otel-collector:4318
    secrets:
      - postgres_password
      - api_key_pepper
      - redis_password
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # The health check is defined in the image: the binary probes itself, since the image has no shell or curl.

  # Background worker (ADR-012). It runs no jobs yet; it proves the image, the health checks and the lifecycle. It has no
  # published port: its probe listener is on loopback inside the container and the image's health check reads it.
  worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
    image: fip-worker:local
    <<: *app-hardening
    restart: unless-stopped
    environment:
      <<: *app-environment
      TELEMETRY_OTLP_ENDPOINT: http://otel-collector:4318
    secrets:
      - postgres_password
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  # Throw-away database for integration tests. Trust authentication is acceptable only because it is bound to loopback,
  # holds no real data and lives in memory; it must never be reused for anything else.
  postgres-test:
    profiles: ["test"]
    image: *postgres-image
    environment:
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Throw-away Redis for integration tests: loopback only, no data kept, no password (it holds nothing real).
  redis-test:
    profiles: ["test"]
    image: *redis-image
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

secrets:
  postgres_superuser_password:
    file: ../../secrets/postgres_superuser_password
  postgres_migrator_password:
    file: ../../secrets/postgres_migrator_password
  postgres_password:
    file: ../../secrets/postgres_password
  postgres_admin_password:
    file: ../../secrets/postgres_admin_password
  postgres_readonly_password:
    file: ../../secrets/postgres_readonly_password
  redis_password:
    file: ../../secrets/redis_password
  api_key_pepper:
    file: ../../secrets/api_key_pepper
  grafana_admin_password:
    file: ../../secrets/grafana_admin_password

volumes:
  pgdata:
  promdata:
