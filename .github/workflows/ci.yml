name: ci

# Pull-request and main pipeline (ADR-029). Local-first scope (D1): no deploy, IaC or registry stages.
# Third-party actions are pinned to full commit SHAs; tools are pinned in the Makefile (container tools by image digest).
# setup-go caches the module download and the build output, keyed on go.sum.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make lint
      - run: make workflows

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-race

  arch:
    name: arch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make arch

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln
      - run: make sast

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan history, not only the tip
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make secrets

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build

  openapi:
    name: openapi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the breaking-change check needs the base branch
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Generated code is up to date with the contract
        run: |
          make generate
          git diff --exit-code -- internal/platform/httpserver/openapi || {
            echo "::error::Generated code is stale. Run 'make generate' and commit the result."
            exit 1
          }
      - name: Contract is valid and matches routes and access policies
        run: make openapi
      - name: No breaking changes to /v1 against the base branch
        run: sh ./scripts/openapi-breaking.sh origin/main

  # Validates the migrations themselves (docs/operations/migrations-ci.md). It needs the base branch, to prove that
  # nothing already applied was edited, and a real PostgreSQL, to prove that every migration applies, reverts and
  # rebuilds the committed schema snapshot. The integration job below also runs these tests; this job gives the
  # migration checks their own named result and makes the append-only rule explicit.
  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          # trust auth: the container lives only for this job and is reachable only from the runner (loopback)
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fip_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the append-only check compares with the merge base on the base branch
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Applied migrations are never edited, renamed or deleted
        run: go run ./scripts/migrationcheck origin/main
      - name: Migration policy (expand-only, explicit grants, numbering)
        run: go test -count=1 ./migrations/
      - name: Apply, revert one by one, round trip, and compare the schema with the committed snapshot
        run: go test -tags integration -count=1 -v ./internal/platform/database/migrate/
        env:
          TEST_POSTGRES_DSN: postgres://postgres@localhost:5432/fip_test?sslmode=disable

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Backing services are declared so the job and its check name are stable; both are pinned by digest.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          # trust auth: the container lives only for this job and is reachable only from the runner (loopback)
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fip_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["127.0.0.1:6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make integration
        env:
          TEST_POSTGRES_DSN: postgres://postgres@localhost:5432/fip_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379

  # SonarCloud analysis of every PR and every merge to main. Disabled until the repository variable
  # SONAR_ENABLED is "true" (see docs/operations/sonarcloud.md). Never runs for fork PRs (no secrets).
  sonar:
    name: sonar
    if: ${{ vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    # Coverage includes the integration tests: the database code is only exercised against a real PostgreSQL, so unit
    # tests alone under-report it badly. Same digest-pinned image as the other jobs.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          # trust auth: the container lives only for this job and is reachable only from the runner (loopback)
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fip_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["127.0.0.1:6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # blame data and new-code detection need full history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make coverage-integration
        env:
          TEST_POSTGRES_DSN: postgres://postgres@localhost:5432/fip_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

  # Container images (ADR-034, docs/operations/container-ci.md): lint the Dockerfile, validate Compose, build the images,
  # scan them for HIGH and CRITICAL vulnerabilities that have a fix, and keep an SBOM per image as an artifact. Every
  # step is a make target, so the same checks run locally.
  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make dockerfile-lint compose-check observability-check
      - run: make image-scan
      - run: make sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/*.spdx.json
          if-no-files-found: error
          retention-days: 30

  # Reviews the dependency changes of a pull request (vulnerabilities and licences, including GitHub Actions). It needs
  # the base and head of a pull request, so it is skipped on pushes to main. ci-gate accepts that.
  dependency-review:
    name: dependency-review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never # a comment needs pull-requests: write; the job summary is enough

  # CodeQL static analysis of the Go code, alongside gosec and SonarCloud. It uploads results to the Security tab, so it
  # needs security-events: write, which a fork pull request does not get; like sonar, it is skipped for forks.
  codeql:
    name: codeql
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go

  # The single status check required by branch protection. Add or remove jobs above without touching
  # the protection rule: this job fails when any needed job failed or was cancelled.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [lint, test, arch, security, secrets, build, openapi, migrations, integration, images, sonar, dependency-review, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # These jobs may be skipped (sonar until it is enabled, dependency-review outside pull requests, sonar and
          # codeql for fork pull requests); failure or cancellation of any job still blocks the merge.
          optional='["sonar", "dependency-review", "codeql"]'
          failed=$(echo "$NEEDS" | jq -r --argjson optional "$optional" 'to_entries[] | select(.key as $k | $optional | index($k) | not) | select(.value.result != "success") | .key')
          blocked=$(echo "$NEEDS" | jq -r --argjson optional "$optional" 'to_entries[] | select(.key as $k | $optional | index($k)) | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Required jobs not successful: $failed"
            exit 1
          fi
          if [ -n "$blocked" ]; then
            echo "::error::Jobs failed or were cancelled: $blocked"
            exit 1
          fi
          echo "All required jobs passed."
