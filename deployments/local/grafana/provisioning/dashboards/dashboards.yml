# Loads every dashboard JSON file from /dashboards (mounted read-only from deployments/local/grafana/dashboards).
# The files are the source of truth: UI edits are refused, so a dashboard changes through a reviewed commit.
apiVersion: 1
providers:
  - name: fip
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /dashboards
