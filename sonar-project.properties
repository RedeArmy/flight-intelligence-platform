# SonarCloud / SonarQube Cloud analysis settings. Organization and project key are NOT stored here:
# CI passes them from repository variables (SONAR_ORGANIZATION, SONAR_PROJECT_KEY); the token is the
# repository secret SONAR_TOKEN. See docs/operations/sonarcloud.md.
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=**/*_test.go,docs/**,**/testdata/**,**/gen/**,**/*.pb.go,bin/**,scripts/**,**/*.gen.go
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
# Test-support code is exercised by the tests themselves and is not production behaviour, so it is left out of the coverage figure.
sonar.coverage.exclusions=**/dbtest/**
